services:
  temporal:
    image: temporalio/temporal
    ports:
      - "7233:7233"
      - "8233:8233"
    command: server start-dev --ip 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health"]
      interval: 10s
      timeout: 10s
      retries: 3

  worker:
    image: worker
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    restart: on-failure
    depends_on:
      temporal:
        condition: service_healthy
    volumes:
      - temp-images:/app/temp_images

  ui:
    image: ui
    build:
      context: .
      dockerfile: Dockerfile.ui
    env_file: .env
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "8234:8234"
    restart: on-failure
    depends_on:
      temporal:
        condition: service_healthy
    volumes:
      - temp-images:/app/temp_images

volumes:
  temp-images:
